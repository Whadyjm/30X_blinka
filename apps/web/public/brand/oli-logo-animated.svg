<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="144" height="144" role="img" aria-label="Oli">
  <style>
    .eye, .brows, .gaze { transform-box: fill-box; transform-origin: center; }
    .eye { animation: blink 6.4s ease-in-out infinite; }
    .brows { animation: brows 6.4s ease-in-out infinite; }
    .gaze { animation: gaze 17s ease-in-out infinite; }
    @keyframes blink {
      0%, 30%, 33.2%, 100% { transform: scaleY(1); }
      31.6% { transform: scaleY(0.1); }
      78%, 81.2% { transform: scaleY(1); }
      79.6% { transform: scaleY(0.1); }
    }
    @keyframes brows {
      0%, 29%, 34%, 77%, 82%, 100% { transform: translateY(0); }
      31.6% { transform: translateY(0.5px); }
      79.6% { transform: translateY(0.5px); }
    }
    @keyframes gaze {
      0%, 14%, 30%, 52%, 70%, 100% { transform: translate(0, 0); }
      18%, 25% { transform: translate(-0.9px, -0.2px); }
      56%, 64% { transform: translate(0.9px, 0.1px); }
    }
    @media (prefers-reduced-motion: reduce) { .eye, .brows, .gaze { animation: none; } }
  </style>
  <path fill="#0c0a08" d="M18.2 3C26.8 3 33 9.1 33 17.7 33 26.7 26.9 33 18.1 33 9.5 33 3 26.8 3 18.2 3 9.4 9.5 3 18.2 3Z"/>
  <g class="gaze">
    <g fill="#e4f222"><rect class="eye" x="12.2" y="15" width="3.6" height="7" rx="1.8"/><rect class="eye" x="20.2" y="15" width="3.6" height="7" rx="1.8"/></g>
    <g class="brows" stroke="#e4f222" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M11.7 12.3c1.2-.9 2.9-1.1 4.4-.5"/><path d="M20 11.8c1.5-.6 3.2-.4 4.4.5"/></g>
  </g>
</svg>
