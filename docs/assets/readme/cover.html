<!doctype html><html lang="es"><meta charset="utf-8"><title>Oli · Reto Blinka</title>
<style>
@font-face{font-family:Inter;src:url('../../../examples/conversation-proposal/assets/inter.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#141515;color:#f5f1e8;font-family:Inter,sans-serif}.hero{position:relative;width:1440px;height:560px;overflow:hidden;padding:58px 72px}h1{font-size:96px;letter-spacing:-.04em;font-weight:500;margin:0 0 26px;line-height:1}.point{color:#f2cf66}.promise{font-size:42px;font-weight:400;line-height:1.19;letter-spacing:-.03em;margin:0;max-width:810px}.desc{font-size:22px;color:#bdc0b8;line-height:1.6;margin:25px 0 0}.footer{position:absolute;bottom:42px;left:72px;right:72px;border-top:1px solid #373a35;padding-top:20px;display:flex;justify-content:space-between;font-size:16px;color:#bdc0b8}.footer span:first-child{color:#f2cf66}.mascot{position:absolute;right:-8px;top:-44px;width:600px;height:600px}canvas{display:block;width:100%;height:100%}.expressions{width:1440px;height:350px;display:flex;background:#141515;padding:15px 40px 38px}.expression{flex:1;display:flex;flex-direction:column;align-items:center}.expression canvas{width:250px;height:250px}.expression span{font-size:20px;color:#bdc0b8;margin-top:10px}.expressions{display:none}body[data-view="expressions"] .hero{display:none}body[data-view="expressions"] .expressions{display:flex}
body[data-view="mobile"] .hero{width:720px;height:840px;padding:48px 50px}body[data-view="mobile"] .mascot{right:110px;top:318px;width:500px;height:500px}body[data-view="mobile"] .footer{left:50px;right:50px;bottom:30px}body[data-view="mobile"] .footer span:last-child{display:none}
</style>
<div class="hero"><h1>Oli<span class="point">.</span></h1><p class="promise">Tu empresa pone las reglas.<br>Oli decide con ellas.</p><p class="desc">Lee facturas. Respeta límites.<br>Explica cada decisión.</p><div class="mascot"><canvas id="oli"></canvas></div><div class="footer"><span>Decidir · Registrar · Explicar</span><span>Construida para el reto Blinka / 30X</span></div></div>
<div class="expressions"><div class="expression"><canvas data-state="listening"></canvas><span>Escuchando</span></div><div class="expression"><canvas data-state="thinking"></canvas><span>Pensando</span></div><div class="expression"><canvas data-state="focused"></canvas><span>Concentrada</span></div><div class="expression"><canvas data-state="celebrating"></canvas><span>Celebrando</span></div></div>
<script type="module">import{OliCanvas}from'../../../packages/oli/src/renderer.js';if(new URLSearchParams(location.search).has('expressions'))document.body.dataset.view='expressions';else if(new URLSearchParams(location.search).has('mobile'))document.body.dataset.view='mobile';const c=document.querySelector('#oli');window.oli=new OliCanvas(c,{state:'happy',dark:true,paused:true,particles:2000});window.expressions=[...document.querySelectorAll('[data-state]')].map(c=>new OliCanvas(c,{state:c.dataset.state,dark:true,paused:true,particles:1600}));window.ready=true;</script></html>
